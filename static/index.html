<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f14">
  <meta name="color-scheme" content="dark">
  <title>Node Warden</title>
  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/style.css">
</head>
<body data-base="/warden">
  <div class="boot" id="boot" role="status" aria-live="polite">
    <span class="boot-mark" aria-hidden="true">NW</span>
    <span>正在检查登录状态…</span>
  </div>

  <section class="login" id="login" hidden>
    <aside class="login-brand">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">NW</span>
        <span class="brand-name">Node Warden</span>
      </div>
      <div class="login-copy">
        <p class="eyebrow">SERVER MANAGEMENT CONSOLE</p>
        <h1>服务器管理<br><em>控制台</em></h1>
        <p class="login-lede">用于管理当前服务器上的服务、证书、配置备份和 sing-box。登录需要访问密钥。</p>
      </div>
      <div class="login-meta">
        <span class="signal"><i></i> 仅限授权访问</span>
        <span id="login-endpoint">Node Warden</span>
      </div>
    </aside>
    <main class="login-panel">
      <form class="login-card" id="login-form" autocomplete="on">
        <p class="eyebrow">身份验证</p>
        <h2>登录</h2>
        <p class="muted">请输入访问密钥。</p>
        <label class="field">
          <span>访问密钥</span>
          <input id="login-key" name="key" type="password" autocomplete="current-password" spellcheck="false" placeholder="请输入访问密钥" required>
        </label>
        <button class="btn btn-primary btn-block" id="login-submit" type="submit">登录</button>
        <p class="form-error" id="login-error" hidden></p>
        <p class="login-hint">连续输入错误会触发登录限制。服务器保存密钥的 SHA-256 摘要，并保留仅 root 可读的恢复文件。</p>
      </form>
      <p class="login-foot">Node Warden <span id="login-version"></span></p>
    </main>
  </section>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">NW</span>
        <div>
          <span class="brand-name">Node Warden</span>
          <span class="brand-sub">服务器管理控制台</span>
        </div>
      </div>
      <div class="top-node">
        <span class="eyebrow">NODE</span>
        <strong id="top-host">—</strong>
        <span id="top-url" class="top-url"></span>
      </div>
      <div class="top-actions">
        <span class="conn" id="conn"><i></i><span>已连接</span></span>
        <button class="btn btn-quiet btn-sm" id="refresh" type="button" title="刷新当前页面">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.2 7.4A7 7 0 1 0 17 10" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M17 3.8v4.4h-4.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          刷新
        </button>
        <button class="btn btn-quiet btn-sm" id="logout" type="button">退出</button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar">
        <nav class="nav" aria-label="主导航">
          <button class="nav-item is-active" data-view="overview" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11.5" y="2.5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2.5" y="11.5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11.5" y="11.5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>总览</span><kbd>01</kbd>
          </button>
          <button class="nav-item" data-view="services" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.4 17 6v8l-7 3.6L3 14V6l7-3.6Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.4 6.2 10 9.7l6.6-3.5M10 9.7v7.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>服务</span><kbd>02</kbd>
          </button>
          <button class="nav-item" data-view="metrics" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16.5V4M3 16.5h14" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m5.5 12.6 3.2-3.6 2.6 2.2 4.4-5.1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>指标</span><kbd>03</kbd>
          </button>
          <button class="nav-item" data-view="proxies" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="15.5" cy="5" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="15.5" cy="15" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.3 9.2 13.6 5.8M6.3 10.8l7.3 3.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>代理</span><kbd>04</kbd>
          </button>
          <button class="nav-item" data-view="singbox" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.2 10h13.6M10 3c2 2.2 3 4.5 3 7s-1 4.8-3 7c-2-2.2-3-4.5-3-7s1-4.8 3-7Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>Sing-box</span><kbd>05</kbd>
          </button>
          <button class="nav-item" data-view="backups" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.2h14v10.3H3zM3 6.2 5.4 3h9.2L17 6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 10h4" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>备份</span><kbd>06</kbd>
          </button>
          <button class="nav-item" data-view="audit" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h8l2 2v12H5z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7h4M8 10h4M8 13h2.5" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>审计</span><kbd>07</kbd>
          </button>
          <button class="nav-item" data-view="settings" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 1.4v2.2M10 16.4v2.2M1.4 10h2.2M16.4 10h2.2" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>设置</span><kbd>08</kbd>
          </button>
        </nav>
        <div class="sidebar-foot">
          <div class="sidebar-line"><span>NODE WARDEN</span><span id="version">v—</span></div>
          <div class="sidebar-line subtle"><span id="foot-node">—</span><span id="sidebar-clock">—</span></div>
        </div>
      </aside>

      <main class="main" id="main">
        <section class="view" data-view-panel="overview" id="view-overview"><div id="overview-content"></div></section>
        <section class="view" data-view-panel="services" id="view-services" hidden><div id="services-content"></div></section>
        <section class="view" data-view-panel="metrics" id="view-metrics" hidden><div id="metrics-content"></div></section>
        <section class="view" data-view-panel="proxies" id="view-proxies" hidden><div id="proxies-content"></div></section>
        <section class="view" data-view-panel="singbox" id="view-singbox" hidden><div id="singbox-content"></div></section>
        <section class="view" data-view-panel="backups" id="view-backups" hidden><div id="backups-content"></div></section>
        <section class="view" data-view-panel="audit" id="view-audit" hidden><div id="audit-content"></div></section>
        <section class="view" data-view-panel="settings" id="view-settings" hidden><div id="settings-content"></div></section>
      </main>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-veil" data-close="modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <h2 id="modal-title">—</h2>
        <button class="icon-btn" id="modal-close" type="button" aria-label="关闭">×</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-foot" id="modal-foot" hidden></footer>
    </div>
  </div>

  <div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="true"></div>

  <noscript><p class="noscript">Node Warden 需要启用 JavaScript。</p></noscript>
  <script src="static/app.js" defer></script>
</body>
</html>
